# 프론트엔드 자동 검사. 기술스택 문서 §6의 6단계를 그대로 옮겼다.
# 협업규칙 1장 병합 조건의 "CI 통과"가 이 워크플로의 verify 작업을 가리킨다.
# ruleset에 필수 상태 검사로 걸려 있지는 않으므로 사람이 확인한다.
name: web CI

# web/이나 이 파일을 바꿨을 때만 돈다. 모든 단계가 web/ 안에서 돌고,
# contracts/openapi.yaml은 gen:api를 돌릴 때만 읽으므로 범위에 넣지 않는다.
# 이 검사를 ruleset 필수 검사로 걸면 경로가 안 맞아 건너뛴 PR이 '대기 중'으로
# 남아 병합이 막힌다. 그때는 paths 대신 작업 안에서 건너뛰는 방식으로 바꾼다.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

defaults:
  run:
    working-directory: web

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # lock 파일 기준으로 설치해 팀원·CI가 같은 버전을 쓴다
      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 코드 형식
        run: npm run format:check

      - name: 단위·컴포넌트 테스트
        run: npm run test

      - name: 빌드
        run: npm run build

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # MSW 목 모드로 돌기 때문에 백엔드 없이 검사된다
      - name: E2E
        run: npm run e2e

      - name: 실패 시 E2E 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
