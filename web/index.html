<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      검색·공유 미리보기 (#309). 카카오톡·슬랙의 미리보기 봇은 JS를 돌리지 않으므로 공통 값은 여기 둔다.
      제목·설명은 src/app/PageHead.tsx의 DEFAULT_TITLE·DEFAULT_DESCRIPTION과 같아야 한다(PageHead.test가 묶는다).
      화면별 제목·noindex·canonical은 PageHead가 단다.
      og:url은 두지 않는다. 이 HTML은 모든 주소에 똑같이 나가서(nginx try_files), 박아 두면 어느 화면을
      공유해도 홈으로 귀속된다. 없으면 미리보기 서비스는 받은 주소를 쓴다(#326 리뷰).
    -->
    <title>Codingmon | 틀린 이유까지 알려 주는 코딩 연습장</title>
    <meta
      name="description"
      content="문제를 풀고 제출하면 어느 줄에서 왜 틀렸는지 AI가 짚어 주고, 정답 대신 다음 한 걸음을 힌트로 알려 주는 코딩 연습장이에요. Python·C++로 풀어 보세요."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codingmon" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Codingmon | 틀린 이유까지 알려 주는 코딩 연습장" />
    <meta
      property="og:description"
      content="어느 줄에서 왜 틀렸는지 AI가 짚어 주고, 정답 대신 다음 한 걸음을 힌트로 알려 줘요."
    />
    <meta property="og:image" content="https://codingmon.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="코딩몬 — 틀린 이유까지 알려 주는 코딩 연습장" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 네이버 서치어드바이저 소유 확인. 지우면 확인이 풀린다(구글 서치콘솔은 DNS TXT로 확인한다) -->
    <meta name="naver-site-verification" content="b0694971d1f72e51a0c2afd042ef743c70cd9df6" />
    <!-- 브라우저 주소창 색. index.css의 --background(라이트·다크)와 같다 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e111d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- AI 검색이 서비스 이름과 용도를 그대로 인용하도록 랜딩 문구와 맞춘다 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://codingmon.tech/#website",
            "url": "https://codingmon.tech/",
            "name": "Codingmon",
            "alternateName": "코딩몬",
            "inLanguage": "ko-KR",
            "publisher": { "@id": "https://codingmon.tech/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://codingmon.tech/#organization",
            "name": "Codingmon",
            "alternateName": "코딩몬",
            "url": "https://codingmon.tech/",
            "logo": "https://codingmon.tech/icon-512.png"
          },
          {
            "@type": "WebApplication",
            "name": "Codingmon",
            "alternateName": "코딩몬",
            "url": "https://codingmon.tech/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "inLanguage": "ko-KR",
            "description": "문제를 풀고 제출하면 어느 줄에서 왜 틀렸는지 AI가 짚어 주고, 정답 대신 다음 한 걸음을 힌트로 알려 주는 코딩 연습장. Python과 C++를 지원한다.",
            "publisher": { "@id": "https://codingmon.tech/#organization" }
          }
        ]
      }
    </script>
    <!--
      테마를 번들보다 먼저 정한다.

      main.tsx는 (목 모드면 MSW를 띄운 뒤) App을 동적 import한 다음에야 렌더하므로,
      ThemeProvider의 useLayoutEffect는 그 전 구간을 덮지 못한다. 그 사이에는
      index.css의 :root(라이트) 값으로 칠해져, 다크를 저장해 둔 사용자가 새로고침하면
      청크가 도착할 때까지 흰 배경을 본다.

      src/app/theme.ts의 resolveInitialTheme·applyTheme과 같은 규칙이다. 저장 키를
      바꾸면 두 곳을 함께 고쳐야 한다. e2e/layout.spec.ts가 번들을 막은 채
      이 스크립트만으로 클래스가 붙는지 검사한다.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('codari-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // localStorage 접근이 막힌 브라우저. 기본값(라이트)으로 둔다.
        }
      })()
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!--
      글꼴 CSS를 렌더 차단 자원으로 두지 않는다. media="print"로 받아 두고 onload에서
      적용 대상으로 바꾼다. 일반 stylesheet로 두면 cdn.jsdelivr.net이 막힌 사내망·CI에서
      응답을 기다리는 동안 첫 페인트가 밀리고, load를 기다리는 Playwright page.goto도
      함께 지연된다. 이 글꼴은 font-display:swap이라 늦게 와도 폴백에서 자연히 바뀐다.

      integrity는 커밋 SHA 고정과 별개로 내용까지 검증한다(같은 URL을 두 번 받아 해시가
      동일함을 확인했다). 다만 이 CSS가 참조하는 92개 서브셋 woff2에는 적용되지 않는다 —
      선택자와 url()을 이용한 변조를 막는 것이 목적이다.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@5c41199ea0024a9e0b2cb31735265056e5472d76/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      integrity="sha384-5aKQt3hR1ZMe2PuqrGxr7RHHgq6ITxfLV+pFi+b7PCqH4SqKIkcztfpLHg97YgbB"
      crossorigin="anonymous"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
